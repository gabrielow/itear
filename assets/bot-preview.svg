<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="frame-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#25D366" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Marco Principal Dispositivo / Consola Móvil -->
  <rect x="18" y="16" width="384" height="528" rx="32" fill="#0b101b" stroke="url(#frame-border)" stroke-width="2.2" filter="url(#card-shadow)"/>

  <!-- Barra Superior -->
  <rect x="152" y="28" width="116" height="12" rx="6" fill="#1e293b"/>
  <circle cx="166" cy="34" r="2.8" fill="#38bdf8"/>

  <!-- Cabecera de Canal Unificado -->
  <rect x="20" y="50" width="380" height="62" fill="#111927"/>
  <circle cx="52" cy="81" r="18" fill="#0d1321" stroke="#25D366" stroke-width="2"/>
  <path d="M 43 81 L 48 81 L 50 75 L 54 87 L 56 81 L 61 81" stroke="#25D366" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="77" font-family="'Inter', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#f8fafc">ITe • Eficiencia &amp; Telemetría</text>
  <circle cx="84" cy="92" r="3.5" fill="#25D366"/>
  <text x="93" y="95" font-family="'Inter', system-ui, sans-serif" font-size="10.2" font-weight="600" fill="#25D366">Planta, Campo y ERP conectados a WhatsApp</text>

  <!-- Fondo Área de Reportes -->
  <rect x="20" y="112" width="380" height="430" rx="0" fill="#080c14"/>

  <!-- Tarjeta 1: Agro, Avicultura, Ganadería y Piscicultura -->
  <g transform="translate(34, 126)">
    <rect width="352" height="86" rx="12" fill="#111a29" stroke="#1e3a2f" stroke-width="1.2"/>
    <rect x="12" y="11" width="106" height="18" rx="9" fill="#0f291e"/>
    <text x="20" y="23" font-family="'Inter', system-ui, sans-serif" font-size="9.2" font-weight="700" fill="#25D366">● AGRO &amp; CRIANZA</text>
    <text x="292" y="23" font-family="'Inter', system-ui, sans-serif" font-size="9.5" fill="#64748b">03:14 hs</text>
    <text x="14" y="45" font-family="'Inter', system-ui, sans-serif" font-size="11.8" font-weight="700" fill="#f1f5f9">🐔🐟 Galpón #3 y Estanque #2 Estables</text>
    <text x="14" y="62" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Galpón 25.4 °C (Extractores OK) • O2 en 5.8 mg/L</text>
    <text x="14" y="77" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">✓ Control autónomo local (actúa sin internet)</text>
  </g>

  <!-- Tarjeta 2: Industria de la Madera & Robótica por Cómputo -->
  <g transform="translate(34, 224)">
    <rect width="352" height="82" rx="12" fill="#111a29" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="11" width="128" height="18" rx="9" fill="#0f2236"/>
    <text x="20" y="23" font-family="'Inter', system-ui, sans-serif" font-size="9.2" font-weight="700" fill="#38bdf8">● MADERA &amp; ROBÓTICA</text>
    <text x="292" y="23" font-family="'Inter', system-ui, sans-serif" font-size="9.5" fill="#64748b">09:40 hs</text>
    <text x="14" y="44" font-family="'Inter', system-ui, sans-serif" font-size="11.8" font-weight="700" fill="#f1f5f9">🌲⚙️ Línea Corte &amp; Secadero Controlados</text>
    <text x="14" y="61" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Posicionador multieje exacto • Secadero HR 48%</text>
    <text x="14" y="75" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#25D366">✓ +Rinde por rollo • Paquete #84 directo al ERP</text>
  </g>

  <!-- Tarjeta 3: Frigorífico, Faena y Cadena de Frío -->
  <g transform="translate(34, 318)">
    <rect width="352" height="82" rx="12" fill="#111a29" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="12" y="11" width="126" height="18" rx="9" fill="#1e1b38"/>
    <text x="20" y="23" font-family="'Inter', system-ui, sans-serif" font-size="9.2" font-weight="700" fill="#a78bfa">● FRIGORÍFICO &amp; FAENA</text>
    <text x="292" y="23" font-family="'Inter', system-ui, sans-serif" font-size="9.5" fill="#64748b">11:05 hs</text>
    <text x="14" y="44" font-family="'Inter', system-ui, sans-serif" font-size="11.8" font-weight="700" fill="#f1f5f9">🥩 Pesaje en Riel &amp; Cámara de Frío #1</text>
    <text x="14" y="61" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#94a3b8">Tropa #12 trazada sin papel • Cámara en -1.8 °C</text>
    <text x="14" y="75" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">✓ Merma enfriamiento: 1.4% • Etiquetas impresas</text>
  </g>

  <!-- Tarjeta 4: Logística B2B/B2C & Sistemas ERP/CRM -->
  <g transform="translate(34, 412)">
    <rect width="352" height="82" rx="12" fill="#111f24" stroke="#25D366" stroke-width="1.3"/>
    <rect x="12" y="11" width="136" height="18" rx="9" fill="#0f291e"/>
    <text x="20" y="23" font-family="'Inter', system-ui, sans-serif" font-size="9.2" font-weight="700" fill="#25D366">● LOGÍSTICA B2B/B2C &amp; ERP</text>
    <text x="292" y="23" font-family="'Inter', system-ui, sans-serif" font-size="9.5" fill="#64748b">11:22 hs</text>
    <text x="14" y="44" font-family="'Inter', system-ui, sans-serif" font-size="11.8" font-weight="700" fill="#ffffff">🚚📦 Ruta B2B #19 &amp; Despachos B2C</text>
    <text x="14" y="61" font-family="'Inter', system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Carga verificada sin errores • Stock atómico (&lt;5 ms)</text>
    <text x="14" y="75" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#25D366">✓ Cero planillas manuales • Cta. Cte. imputada</text>
  </g>

  <!-- Barra Inferior de Comandos Rápidos -->
  <rect x="34" y="504" width="352" height="28" rx="14" fill="#131c2e" stroke="#26354d" stroke-width="1"/>
  <text x="210" y="522" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10.2" font-weight="600" fill="#94a3b8">⚡ Dato único: Balanza / Máquina ➔ ERP &amp; WhatsApp</text>
</svg>
