<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="phone-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>
    <filter id="phone-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#25D366" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect x="20" y="20" width="380" height="500" rx="36" fill="#0d1117" stroke="url(#phone-border)" stroke-width="2.5" filter="url(#phone-shadow)"/>
  
  <!-- Notch / Speaker -->
  <rect x="150" y="32" width="120" height="14" rx="7" fill="#1e293b"/>
  <circle cx="165" cy="39" r="3" fill="#334155"/>

  <!-- Chat Header -->
  <rect x="23" y="58" width="374" height="60" fill="#161f2e"/>
  <!-- Avatar -->
  <circle cx="58" cy="88" r="18" fill="#141026" stroke="#25D366" stroke-width="2"/>
  <text x="50" y="93" font-size="14" fill="#25D366">🤖</text>
  <!-- Name & Status -->
  <text x="86" y="83" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">ITe-Bot Oficial</text>
  <circle cx="89" cy="95" r="3.5" fill="#25D366"/>
  <text x="98" y="98" font-family="'Inter', sans-serif" font-size="11" fill="#25D366" font-weight="500">en línea • 24/7</text>

  <!-- Chat Background Pattern hint -->
  <rect x="23" y="118" width="374" height="398" fill="#0a0e17" rx="0"/>

  <!-- Message 1: User -->
  <g transform="translate(190, 140)">
    <rect width="190" height="42" rx="14" fill="#005c4b"/>
    <text x="14" y="26" font-family="'Inter', sans-serif" font-size="12" fill="#ffffff">¡Hola! Necesito un turno</text>
    <text x="155" y="36" font-family="'Inter', sans-serif" font-size="9" fill="#9ca3af">10:42</text>
  </g>

  <!-- Message 2: Bot -->
  <g transform="translate(40, 196)">
    <rect width="280" height="110" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#38bdf8">👋 ¡Hola! Bienvenido a ITe-Bot.</text>
    <text x="14" y="44" font-family="'Inter', sans-serif" font-size="11.5" fill="#e2e8f0">Por favor, elegí tu opción:</text>
    <text x="14" y="66" font-family="'Inter', sans-serif" font-size="11.5" fill="#25D366" font-weight="600">1️⃣ Reservar Turno Online</text>
    <text x="14" y="86" font-family="'Inter', sans-serif" font-size="11.5" fill="#cbd5e1">2️⃣ Guía de Trámites y Formularios</text>
    <text x="245" y="102" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">10:42</text>
  </g>

  <!-- Message 3: User Selection -->
  <g transform="translate(320, 320)">
    <rect width="60" height="36" rx="14" fill="#005c4b"/>
    <text x="18" y="23" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="32" y="30" font-family="'Inter', sans-serif" font-size="9" fill="#9ca3af">10:43</text>
  </g>

  <!-- Message 4: Bot Confirmation -->
  <g transform="translate(40, 370)">
    <rect width="300" height="116" rx="14" fill="#141f2e" stroke="#25D366" stroke-width="1.5"/>
    <text x="14" y="25" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#25D366">✅ ¡Turno Confirmado!</text>
    <text x="14" y="46" font-family="'Inter', sans-serif" font-size="11.5" fill="#f1f5f9">📅 Fecha: Jueves 10 de Septiembre</text>
    <text x="14" y="66" font-family="'Inter', sans-serif" font-size="11.5" fill="#f1f5f9">⏰ Horario: 08:30 hs (Franja 1)</text>
    <text x="14" y="86" font-family="'Inter', sans-serif" font-size="11" fill="#38bdf8">Te enviaremos un recordatorio 24h antes.</text>
    <text x="265" y="108" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8">10:43</text>
  </g>
</svg>
