<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Bot Icon Hexagon -->
  <g transform="translate(6, 6)">
    <polygon points="26,2 50,16 50,44 26,58 2,44 2,16" fill="#141026" stroke="url(#logo-grad)" stroke-width="2.5" filter="url(#logo-glow)" />
    <!-- Bot Eyes / Signal -->
    <circle cx="18" cy="28" r="4" fill="#00f0ff" />
    <circle cx="34" cy="28" r="4" fill="#00f0ff" />
    <path d="M 18 39 Q 26 45 34 39" stroke="#25D366" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Pulse antenna -->
    <line x1="26" y1="12" x2="26" y2="6" stroke="#00f0ff" stroke-width="2" stroke-linecap="round" />
    <circle cx="26" cy="4" r="2" fill="#25D366" />
  </g>

  <!-- Typography -->
  <text x="72" y="38" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    ITe<tspan fill="#25D366">-Bot</tspan>
  </text>
  <text x="74" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="2">
    ENGINE • GO ON-PREMISE
  </text>
</svg>
