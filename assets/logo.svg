<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="ite-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#25D366"/>
    </linearGradient>
    <filter id="ite-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Isotipo Hexagonal de Ingeniería Aplicada (Nodos PCB + Pulso de Control) -->
  <g transform="translate(6, 4)">
    <polygon points="28,3 52,17 52,43 28,57 4,43 4,17" fill="#0d1321" stroke="url(#ite-grad)" stroke-width="2.4" filter="url(#ite-glow)"/>
    <!-- Trazas de interconexión físico-digital -->
    <path d="M 14 30 L 21 30 L 25 20 L 31 40 L 35 30 L 42 30" stroke="#25D366" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="28" y1="10" x2="28" y2="16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="44" x2="28" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <!-- Nodos sensores/actuadores -->
    <circle cx="13" cy="30" r="2.8" fill="#38bdf8"/>
    <circle cx="43" cy="30" r="2.8" fill="#25D366"/>
    <circle cx="28" cy="10" r="2.3" fill="#00f0ff"/>
    <circle cx="28" cy="50" r="2.3" fill="#00f0ff"/>
  </g>

  <!-- Marca Institucional -->
  <text x="72" y="37" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.8">
    IT<tspan fill="url(#ite-grad)">e</tspan>
  </text>
  <text x="73" y="52" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="1.6">
    INTELIGENCIA TECNOLÓGICA
  </text>
</svg>
